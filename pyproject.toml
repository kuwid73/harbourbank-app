[project]
name = "harbourbank-accounts"
version = "0.1.0"
description = "Harbour Bank accounts-api: customers, accounts and double-entry transfers"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "prometheus-client>=0.26.0",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.17",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, modern syntax, bugbear, simplify, blind except
select = ["F", "E", "W", "I", "UP", "B", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291"]   # autogenerated by Alembic
"tests/*" = ["E731"]                         # one-line lambdas keep concurrency tests readable

[tool.ruff.lint.isort]
known-first-party = ["accounts_api", "conftest"]

# Harbour Bank accounts-api pipeline
#   every PR and push : lint + tests (real Postgres via testcontainers)
#   push to main      : build image -> vulnerability scan -> push to GHCR -> bump dev in harbourbank-gitops
# ArgoCD then deploys dev from Git; CI never talks to the cluster.
#
# Third-party actions are pinned to full commit SHAs (tags can be moved to malicious code)
# and to releases at least two weeks old.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs ask for more only where they need it
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kuwid73/harbourbank-accounts-api

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format github .
      - name: Tests
        run: uv run pytest -q

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image tag and version
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load locally; nothing reaches the registry before the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE:$TAG@${digest#*@}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One bump at a time, never cancelled: each commit's bump must land in order
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - name: Check out harbourbank-gitops (deploy key with write access to that repo only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuwid73/harbourbank-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          # zizmor: ignore[artipacked] - this job must push; it uploads no artifacts and the
          # runner (and the key file checkout writes) is discarded when the job ends
      - name: Bump dev image (tag for humans, digest for immutability)
        env:
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
          FILE: apps/harbourbank/overlays/dev/kustomization.yaml
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))' "$FILE"
          git diff --exit-code --quiet && { echo "already at $TAG"; exit 0; }
          git config user.name "harbourbank-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git commit -am "dev: accounts-api $TAG" \
            -m "Source: $repo_url/commit/$GITHUB_SHA" \
            -m "Pipeline: $repo_url/actions/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

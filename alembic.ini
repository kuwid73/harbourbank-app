# Database migrations. The database URL comes from the DATABASE_URL environment variable.
#   alembic upgrade head                              apply pending migrations
#   alembic revision --autogenerate -m "message"      draft a migration from model changes (review it!)
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os
